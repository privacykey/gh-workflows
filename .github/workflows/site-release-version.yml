name: Site release version

# Keeps a static site's displayed product version in step with the product
# repository's GitHub Releases: reads the latest releases, writes
# version.json at the site root, rewrites the release markers in the HTML,
# and commits only when something changed. Then it stops.
#
# The commit still reaches the live site. The sites deploy through
# Cloudflare Workers Builds (Git integration): Cloudflare's GitHub App
# receives the push webhook for the bot's commit and runs `npx wrangler
# deploy`. GitHub's recursion guard — a commit pushed with GITHUB_TOKEN
# never triggers another *workflow* — suppresses workflow triggers only,
# not external webhooks, so no deploy step is needed here and no
# Cloudflare credential ever reaches GitHub.
#
# The caller's checkout is at github.ref, so on a schedule the commit lands
# on the default branch and on a manual dispatch on whichever branch was
# picked. The composite action comes from a second checkout of this repo
# at job.workflow_sha — the exact commit this workflow file was taken
# from — into .gh-workflows/, which the caller's .assetsignore must list
# (see docs/site-release-version.md). Only version.json and tracked files
# are ever staged, so that checkout cannot leak into the commit.
#
# Caller (runs hourly; see docs/site-release-version.md for the markers):
#   on:
#     schedule:
#       - cron: '17 * * * *'
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     sync:
#       uses: privacykey/gh-workflows/.github/workflows/site-release-version.yml@v1
#       with:
#         repo: privacykey/privacycommand

on:
  workflow_call:
    inputs:
      repo:
        description: 'owner/name of the product repository whose releases to read.'
        type: string
        required: true
      tags:
        description: >-
          Comma-separated NAME=GLOB list mapping marker names to tag
          patterns, e.g. "app=v*" or "cli=cli-v*,full=full-v*,edge=edge-v*".
          The version is the tag with the glob's literal prefix stripped.
        type: string
        required: false
        default: 'app=v*'
      include-prereleases:
        description: 'Let a prerelease win when it is the newest match.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}

      # job.workflow_sha is the commit this workflow file was taken from — the
      # documented way for a reusable workflow to fetch its own repository.
      # It is read through toJSON(job) because actionlint 1.7.12 does not know
      # the property yet (rhysd/actionlint#707); `just lint` must stay clean.
      # Falls back to v1 if the property is missing.
      - name: Locate the shared actions
        id: shared
        env:
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          repo=$(jq -r '.workflow_repository // empty' <<<"${JOB_JSON}")
          sha=$(jq -r '.workflow_sha // empty' <<<"${JOB_JSON}")
          if [ "${repo}" = "privacykey/gh-workflows" ] && [ -n "${sha}" ]; then
            echo "ref=${sha}" >> "${GITHUB_OUTPUT}"
            echo "Shared actions: privacykey/gh-workflows@${sha} (same commit as this workflow)"
          else
            echo "ref=v1" >> "${GITHUB_OUTPUT}"
            echo "::notice::job.workflow_sha not available — shared actions resolved at privacykey/gh-workflows@v1"
          fi

      - name: Check out the shared actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: privacykey/gh-workflows
          ref: ${{ steps.shared.outputs.ref }}
          path: .gh-workflows
          sparse-checkout: actions/site-release-version

      - name: Sync release version
        id: sync
        uses: ./.gh-workflows/actions/site-release-version
        with:
          repo: ${{ inputs.repo }}
          tags: ${{ inputs.tags }}
          include-prereleases: ${{ inputs.include-prereleases }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        env:
          REPO: ${{ inputs.repo }}
          TAGS: ${{ steps.sync.outputs.tags }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u stages modified tracked files only (the HTML); version.json is
          # added by name because the first run creates it. .gh-workflows/ is
          # untracked and is therefore never staged.
          git add -u
          git add version.json
          git commit -m "chore(site): sync release version from ${REPO} (${TAGS})"
          git push origin "HEAD:${GITHUB_REF}"
          echo "Pushed. Cloudflare Workers Builds deploys this commit from the push webhook."
