name: iOS release (reusable)

# Reusable iOS archive/TestFlight pipeline: xcodegen generate →
# xcodebuild archive → -exportArchive → optional `xcrun altool
# --upload-app`.
#
# Shape:
#   job `validate` — NO secrets, no environment. Unsigned Release build for
#                    the simulator, optional tests with an xcresult
#                    artefact. Fails the workflow before the ios-signing
#                    environment gate fires and before any signing material
#                    is touched.
#   job `archive`  — needs: validate, gated by the `ios-signing` environment
#                    and the `signed_archive` input. Archives Release for
#                    generic/platform=iOS, exports a signed .ipa, uploads
#                    IPA + dSYM artefacts, optionally pushes the build to
#                    TestFlight.
#
# Two signing modes (the `signing` input, required):
#
#   runner-keychain — self-hosted runners with the signing identities
#       preinstalled on the fleet keychain. Xcode is signed into the team,
#       so `-allowProvisioningUpdates` mints/renews profiles on its own.
#       ZERO Apple secrets in GitHub. This mode never imports certificates
#       and never deletes anything from the runner's keychain. If
#       `upload_to_testflight` is enabled, the ASC .p8 is expected on the
#       runner at ~/.appstoreconnect/private_keys/AuthKey_<key id>.p8
#       (fleet contract) and only the two ID secrets (APPLE_API_KEY_ID /
#       APPLE_API_ISSUER) are needed.
#
#   import — hosted runners (e.g. macos-15), certificate imported from
#       secrets. Reuses the existing composite actions:
#       setup-apple-keychain imports an Apple Distribution .p12 into an
#       ephemeral keychain (NOTE: for iOS this is an "Apple Distribution"
#       certificate, not the macOS "Developer ID Application" one), and
#       write-asc-api-key stages the ASC .p8. xcodebuild authenticates to
#       the developer portal with -authenticationKeyPath/-authenticationKeyID/
#       -authenticationKeyIssuerID so `-allowProvisioningUpdates` works
#       headlessly. All signing material is cleaned up in an always() step.
#
# Upload tooling:
#   The upload is `xcrun altool --upload-app -f <ipa> -t ios
#   --apiKey <id> --apiIssuer <issuer>` — App Store Connect API-key auth,
#   .p8 discovered from a private_keys directory.
#   `xcrun notarytool` replaced altool for *notarization* (a macOS/DMG
#   concern) and cannot upload iOS builds — it has no role in this
#   workflow. altool --upload-app is Apple-deprecated but still ships and
#   still works. If a future Xcode drops it, the migration path is
#   ExportOptions `destination: upload` on the -exportArchive step (or
#   Transporter); that change lands here once, behind the same inputs, so
#   no `upload_tool` input is speculatively added today.
#
# What this workflow deliberately does NOT do:
#   • bump MARKETING_VERSION — versioning stays a local, human act.
#   • create App Store Connect app records or first-run provisioning — see
#     the consumer repo's own runbook.
#   • push anything to git. contents: read, persist-credentials: false.
#
# Build number (CFBundleVersion): `build_number: auto` (default) is
# minutes since a fixed epoch — monotonic, stateless, no project churn.
# `project` leaves the project's CURRENT_PROJECT_VERSION alone; a bare
# integer forces one.
#
# Pinning: consumers pin this workflow by tag (…/ios-release.yml@v1).
# Composite actions are referenced @v1; third-party actions are SHA-pinned
# with a version comment, using the same pins as
# macos-sparkle-release.yml (see README "Pinning model").

on:
  workflow_call:
    inputs:
      xcodeproj:
        description: >-
          Path of the .xcodeproj relative to the repo root, e.g.
          "MyApp.xcodeproj". Exactly one of xcodeproj / workspace
          must be set. With uses_xcodegen: true the project is generated
          (from project.yml in the same directory) before anything reads it.
        type: string
        required: false
        default: ''
      workspace:
        description: >-
          Path of the .xcworkspace relative to the repo root. Exactly one
          of xcodeproj / workspace must be set.
        type: string
        required: false
        default: ''
      scheme:
        description: >-
          xcodebuild scheme. Also used to name the .xcarchive and the IPA /
          dSYM artefacts.
        type: string
        required: true
      uses_xcodegen:
        description: >-
          Whether the .xcodeproj is generated from project.yml by xcodegen
          before building. In `import` (hosted) mode xcodegen is installed
          via brew; in `runner-keychain` mode it must be preinstalled on
          the self-hosted runner (fleet contract) and the step fails with
          a clear error if it is not.
        type: boolean
        required: false
        default: false
      signing:
        description: >-
          Required. `runner-keychain` — identities already on the (self-
          hosted) runner's keychain, no cert import, zero Apple secrets.
          `import` — hosted runner; Apple Distribution .p12 + ASC API key
          come from secrets via the setup-apple-keychain / write-asc-api-key
          composite actions. See the header comment for the full contract.
        type: string
        required: true
      runner:
        description: >-
          Runner for both jobs: either a plain label ("macos-15") or a JSON
          array string ('["self-hosted", "macOS", "ARM64"]' — double quotes
          inside, it is parsed with fromJSON when it starts with "[").
        type: string
        required: false
        default: 'macos-15'
      xcode_version:
        description: >-
          Xcode selection for hosted runners (`import` mode only), passed
          to maxim-lobanov/setup-xcode. "latest-stable", or a version spec
          when the project pins a specific SDK.
        type: string
        required: false
        default: 'latest-stable'
      developer_dir:
        description: >-
          DEVELOPER_DIR fallback for `runner-keychain` mode, applied only
          when the runner's default xcodebuild is unusable (CommandLineTools
          selected).
        type: string
        required: false
        default: '/Applications/Xcode.app/Contents/Developer'
      export_method:
        description: >-
          Export method when the workflow generates its own ExportOptions
          plist (export_options_path empty): "app-store-connect" (the
          Xcode 15.4+/16+ name for the old "app-store"; TestFlight + App
          Store) or "ad-hoc". Ignored when export_options_path is set.
        type: string
        required: false
        default: 'app-store-connect'
      export_options_path:
        description: >-
          Path of a committed ExportOptions.plist, e.g.
          Scripts/ExportOptions.plist. Takes precedence over export_method
          / team_id. Empty generates a minimal automatic-signing plist
          (method + teamID + destination: export).
        type: string
        required: false
        default: ''
      team_id:
        description: >-
          Apple Developer Team ID for the generated ExportOptions plist,
          required when export_options_path is empty. Also passed to
          xcodebuild as a DEVELOPMENT_TEAM override when non-empty — this
          is how repos that keep the team out of committed config (e.g. in
          a gitignored xcconfig) inject it in CI; pass it from a repo
          variable, e.g. team_id: ${{ vars.APPLE_TEAM_ID }}.
        type: string
        required: false
        default: ''
      build_number:
        description: >-
          CFBundleVersion strategy. "auto" (default) — minutes since
          build_number_epoch, monotonic and stateless. "project" — leave
          the project's CURRENT_PROJECT_VERSION untouched. An integer —
          force that build number.
        type: string
        required: false
        default: 'auto'
      build_number_epoch:
        description: >-
          Unix-epoch origin for the "auto" build-number scheme. The
          default corresponds to 2026-07-12 UTC. Any fixed past date
          works; never move it backwards for a shipped app.
        type: string
        required: false
        default: '1783814400'
      signed_archive:
        description: >-
          When false, only the secret-free validate job runs — this lets a
          caller keep PR/push release validation and a manually dispatched
          signed archive in one workflow: the caller passes an expression
          gating its workflow_dispatch boolean on
          github.event_name == 'workflow_dispatch' (see the consumer
          snippet in docs/ios-release.md).
        type: boolean
        required: false
        default: true
      upload_to_testflight:
        description: >-
          Upload the exported .ipa to App Store Connect (TestFlight) with
          `xcrun altool --upload-app` after the artefacts are stored. Needs
          APPLE_API_KEY_ID + APPLE_API_ISSUER in both modes; `import` mode
          additionally stages the APPLE_API_KEY .p8 for altool.
        type: boolean
        required: false
        default: false
      run_tests:
        description: >-
          Run `xcodebuild test` (Debug, test_destination) in the validate
          job, with an xcresult artefact. Default false — for repos whose
          unit tests already run in a separate CI workflow. Repos without
          separate CI should turn this on: never sign untested code.
        type: boolean
        required: false
        default: false
      test_script:
        description: >-
          Optional shell command replacing the default test invocation
          (runs from the repo root with bash; implies tests run regardless
          of run_tests). Use it to reproduce project-specific invocations,
          e.g. an `-only-testing:` filter against a dedicated simulator.
          The default xcresult upload only happens for the default
          invocation.
        type: string
        required: false
        default: ''
      test_destination:
        description: >-
          -destination for the default test invocation.
        type: string
        required: false
        default: 'platform=iOS Simulator,name=iPhone 16'
      spm_resolved_path:
        description: >-
          Path of a committed Package.resolved to drift-gate, e.g.
          MyApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          Package.resolved. When set, every xcodebuild invocation
          gets -onlyUsePackageVersionsFromResolvedFile (resolution may
          fetch but may not move off the committed pins) and the file is
          checked for drift after xcodegen and after building. Empty
          disables the gate.
        type: string
        required: false
        default: ''
      ipa_retention_days:
        description: >-
          Retention for the IPA workflow artefact. The dSYM artefact is
          always kept 365 days (the GitHub maximum) — symbols outlive
          release artefacts.
        type: number
        required: false
        default: 14
    secrets:
      APPLE_CERTIFICATE:
        description: >-
          base64 .p12 of the Apple Distribution cert + private key (NOT the
          macOS Developer ID one — set it repo-scoped on iOS consumers so
          it shadows any org-level macOS cert). `import` mode only; never
          read in runner-keychain mode.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: 'Passphrase for the .p12 above. `import` mode only.'
        required: false
      APPLE_API_KEY:
        description: >-
          Full PEM contents of the App Store Connect API .p8. `import` mode
          only — in runner-keychain mode the .p8 lives on the runner at
          ~/.appstoreconnect/private_keys/ and is never a GitHub secret.
        required: false
      APPLE_API_KEY_ID:
        description: >-
          10-char ASC Key ID. `import` mode: always required (portal auth
          for -allowProvisioningUpdates). runner-keychain mode: only
          required when upload_to_testflight is true (it is an identifier,
          not key material — the self-hosted "no Apple private keys in
          GitHub" property is preserved).
        required: false
      APPLE_API_ISSUER:
        description: 'ASC Issuer UUID. Same requirement rules as APPLE_API_KEY_ID.'
        required: false

# This workflow never pushes; nothing here needs more than read.
permissions:
  contents: read

# One release pipeline per ref; a half-done archive/upload should finish,
# not be cancelled. NOTE: GitHub evaluates workflow-level concurrency of a
# *called* workflow inconsistently across product versions — callers should
# also declare `concurrency` in their own release.yml (see README snippet).
concurrency:
  group: ${{ github.workflow }}-ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (no secrets)
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This workflow never pushes; don't leave credentials in the checkout.
          persist-credentials: false

      - name: Preflight input validation
        # Pure input logic, up front and in the secret-free job, so a
        # miswired caller fails here — before the ios-signing environment
        # gate ever fires.
        env:
          SIGNING: ${{ inputs.signing }}
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
          EXPORT_OPTIONS_PATH: ${{ inputs.export_options_path }}
          EXPORT_METHOD: ${{ inputs.export_method }}
          TEAM_ID: ${{ inputs.team_id }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_EPOCH: ${{ inputs.build_number_epoch }}
        run: |
          set -euo pipefail
          fail=0
          case "${SIGNING}" in
            runner-keychain|import) ;;
            *)
              echo "::error::signing must be 'runner-keychain' (self-hosted, identities on the runner) or 'import' (hosted, cert from secrets) — got '${SIGNING}'"
              fail=1 ;;
          esac
          if { [[ -n "${XCODEPROJ}" ]] && [[ -n "${XCWORKSPACE}" ]]; } || { [[ -z "${XCODEPROJ}" ]] && [[ -z "${XCWORKSPACE}" ]]; }; then
            echo "::error::exactly one of xcodeproj / workspace must be set"
            fail=1
          fi
          if [[ -z "${EXPORT_OPTIONS_PATH}" ]]; then
            case "${EXPORT_METHOD}" in
              app-store-connect|ad-hoc) ;;
              *)
                echo "::error::export_method must be 'app-store-connect' or 'ad-hoc' — got '${EXPORT_METHOD}'"
                fail=1 ;;
            esac
            if [[ -z "${TEAM_ID}" ]]; then
              echo "::error::team_id is required when export_options_path is empty (it goes into the generated ExportOptions plist)"
              fail=1
            fi
          fi
          case "${BUILD_NUMBER}" in
            auto|project) ;;
            *)
              if ! [[ "${BUILD_NUMBER}" =~ ^[0-9]+$ ]]; then
                echo "::error::build_number must be 'auto', 'project', or an integer — got '${BUILD_NUMBER}'"
                fail=1
              fi ;;
          esac
          if ! [[ "${BUILD_NUMBER_EPOCH}" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number_epoch must be an integer unix timestamp — got '${BUILD_NUMBER_EPOCH}'"
            fail=1
          fi
          exit "${fail}"

      - name: Point at the runner's Xcode
        # xcodebuild needs a full Xcode, not the CommandLineTools
        # instance. Only overrides DEVELOPER_DIR when the default is
        # unusable, honouring whatever the fleet has selected.
        if: inputs.signing == 'runner-keychain'
        env:
          DEVELOPER_DIR_INPUT: ${{ inputs.developer_dir }}
        run: |
          set -euo pipefail
          if ! xcodebuild -version >/dev/null 2>&1; then
            echo "DEVELOPER_DIR=${DEVELOPER_DIR_INPUT}" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        if: inputs.signing == 'import'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        # Hosted images don't ship it. Self-hosted runners must have it
        # preinstalled (fleet contract) — the generate step checks.
        if: inputs.uses_xcodegen && inputs.signing == 'import'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.uses_xcodegen
        env:
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          # Self-hosted runners may keep brew tools out of the default
          # PATH; harmless on hosted images.
          export PATH="/opt/homebrew/bin:$PATH"
          command -v xcodegen >/dev/null || {
            echo "::error::xcodegen is required (preinstalled on self-hosted runners; brew-installed in import mode)"
            exit 1
          }
          cd "$(dirname "${XCODEPROJ:-${XCWORKSPACE}}")"
          xcodegen generate

      - name: Verify the SPM pins did not move (post-generate)
        # The whole point of committing the workspace Package.resolved is
        # reproducible resolution — xcodegen must leave it alone.
        if: inputs.spm_resolved_path != ''
        env:
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SPM_RESOLVED}"

      - name: Unsigned Release build
        # Catches Release-only build breakage with zero signing involved,
        # before the environment approval gate fires.
        env:
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
          SCHEME: ${{ inputs.scheme }}
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${XCWORKSPACE}" ]]; then
            ARGS+=(-workspace "${XCWORKSPACE}")
          else
            ARGS+=(-project "${XCODEPROJ}")
          fi
          if [[ -n "${SPM_RESOLVED}" ]]; then
            ARGS+=(-onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild build \
            "${ARGS[@]}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests (unsigned)
        if: inputs.run_tests || inputs.test_script != ''
        env:
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
          SCHEME: ${{ inputs.scheme }}
          TEST_SCRIPT: ${{ inputs.test_script }}
          TEST_DESTINATION: ${{ inputs.test_destination }}
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
        run: |
          set -euo pipefail
          if [[ -n "${TEST_SCRIPT}" ]]; then
            bash -c "${TEST_SCRIPT}"
            exit 0
          fi
          ARGS=()
          if [[ -n "${XCWORKSPACE}" ]]; then
            ARGS+=(-workspace "${XCWORKSPACE}")
          else
            ARGS+=(-project "${XCODEPROJ}")
          fi
          if [[ -n "${SPM_RESOLVED}" ]]; then
            ARGS+=(-onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild test \
            "${ARGS[@]}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "${TEST_DESTINATION}" \
            -derivedDataPath build/DerivedData-Unit \
            -resultBundlePath build/TestResults/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always() && (inputs.run_tests || inputs.test_script != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ github.run_id }}
          path: build/TestResults/Tests.xcresult
          retention-days: 7
          # A custom test_script may not produce an xcresult bundle.
          if-no-files-found: ignore

  archive:
    name: Signed archive and IPA export
    if: inputs.signed_archive
    needs: validate
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 120
    # Referencing the environment auto-creates it (unprotected) on first
    # run. Add a required-reviewers rule to it in the consumer repo so the
    # pipeline pauses for human approval before any signing happens — and,
    # in `import` mode, scope the APPLE_* secrets to it and call with
    # `secrets: inherit` (environment secrets only resolve inside a job
    # that declares the environment).
    environment: ios-signing
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # No git history needed: the auto build number is stateless
          # (minutes since epoch), unlike the macOS pipeline's
          # rev-list-count scheme. Never pushes either.
          persist-credentials: false

      - name: Point at the runner's Xcode
        if: inputs.signing == 'runner-keychain'
        env:
          DEVELOPER_DIR_INPUT: ${{ inputs.developer_dir }}
        run: |
          set -euo pipefail
          if ! xcodebuild -version >/dev/null 2>&1; then
            echo "DEVELOPER_DIR=${DEVELOPER_DIR_INPUT}" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        if: inputs.signing == 'import'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        if: inputs.uses_xcodegen && inputs.signing == 'import'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.uses_xcodegen
        env:
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          command -v xcodegen >/dev/null || {
            echo "::error::xcodegen is required (preinstalled on self-hosted runners; brew-installed in import mode)"
            exit 1
          }
          cd "$(dirname "${XCODEPROJ:-${XCWORKSPACE}}")"
          xcodegen generate

      - name: Verify the SPM pins did not move (post-generate)
        if: inputs.spm_resolved_path != ''
        env:
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SPM_RESOLVED}"

      - name: Set up keychain + Apple Distribution cert
        # `import` mode only. runner-keychain mode NEVER runs this — the
        # identities are already on the self-hosted runner's keychain and
        # importing (or later deleting) anything there would corrupt shared
        # fleet state.
        if: inputs.signing == 'import'
        id: keychain
        uses: privacykey/gh-workflows/actions/setup-apple-keychain@v1
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        if: inputs.signing == 'import'
        id: asc-key
        uses: privacykey/gh-workflows/actions/write-asc-api-key@v1
        with:
          api-key: ${{ secrets.APPLE_API_KEY }}

      - name: Resolve build number
        id: buildnum
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_EPOCH: ${{ inputs.build_number_epoch }}
        run: |
          set -euo pipefail
          case "${BUILD_NUMBER}" in
            auto)
              # Minutes since the epoch — monotonic, small, rising, and
              # stateless (no project.yml churn or cross-machine drift).
              BN=$(( ($(date +%s) - BUILD_NUMBER_EPOCH) / 60 ))
              echo "Build number (auto): ${BN}"
              ;;
            project)
              BN=""
              echo "Build number: using the project's CURRENT_PROJECT_VERSION"
              ;;
            *)
              BN="${BUILD_NUMBER}"
              echo "Build number (forced): ${BN}"
              ;;
          esac
          echo "build-number=${BN}" >> "$GITHUB_OUTPUT"

      - name: Resolve export options
        id: export-opts
        env:
          EXPORT_OPTIONS_PATH: ${{ inputs.export_options_path }}
          EXPORT_METHOD: ${{ inputs.export_method }}
          TEAM_ID: ${{ inputs.team_id }}
        run: |
          set -euo pipefail
          if [[ -n "${EXPORT_OPTIONS_PATH}" ]]; then
            if [[ ! -f "${EXPORT_OPTIONS_PATH}" ]]; then
              echo "::error::export_options_path '${EXPORT_OPTIONS_PATH}' does not exist"
              exit 1
            fi
            echo "plist-path=${EXPORT_OPTIONS_PATH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Minimal automatic-signing plist. destination stays "export" —
          # artefacts first, upload separately.
          mkdir -p build
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">' '<dict>'
            printf '\t<key>method</key>\n\t<string>%s</string>\n' "${EXPORT_METHOD}"
            printf '\t<key>teamID</key>\n\t<string>%s</string>\n' "${TEAM_ID}"
            printf '\t<key>destination</key>\n\t<string>export</string>\n'
            printf '\t<key>signingStyle</key>\n\t<string>automatic</string>\n'
            if [[ "${EXPORT_METHOD}" == "app-store-connect" ]]; then
              printf '\t<key>uploadSymbols</key>\n\t<true/>\n'
              printf '\t<key>manageAppVersionAndBuildNumber</key>\n\t<false/>\n'
            fi
            printf '%s\n' '</dict>' '</plist>'
          } > build/ExportOptions.generated.plist
          plutil -lint build/ExportOptions.generated.plist
          echo "plist-path=build/ExportOptions.generated.plist" >> "$GITHUB_OUTPUT"

      - name: Build signed archive
        env:
          XCODEPROJ: ${{ inputs.xcodeproj }}
          XCWORKSPACE: ${{ inputs.workspace }}
          SCHEME: ${{ inputs.scheme }}
          SIGNING: ${{ inputs.signing }}
          TEAM_ID: ${{ inputs.team_id }}
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.build-number }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P8_PATH: ${{ steps.asc-key.outputs.p8-path }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${XCWORKSPACE}" ]]; then
            ARGS+=(-workspace "${XCWORKSPACE}")
          else
            ARGS+=(-project "${XCODEPROJ}")
          fi
          ARGS+=(
            -scheme "${SCHEME}"
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "build/${SCHEME}.xcarchive"
            # Automatic signing mints/renews the distribution cert and App
            # Store profiles. runner-keychain mode: authenticated by the
            # runner's signed-in Xcode account.
            -allowProvisioningUpdates
          )
          if [[ -n "${SPM_RESOLVED}" ]]; then
            ARGS+=(-onlyUsePackageVersionsFromResolvedFile)
          fi
          if [[ "${SIGNING}" == "import" ]]; then
            # Hosted runners have no signed-in Xcode account; the developer-
            # portal side of -allowProvisioningUpdates authenticates with
            # the ASC API key instead.
            if [[ -z "${KEY_ID}" || -z "${ISSUER}" || -z "${P8_PATH}" ]]; then
              echo "::error::import signing needs the APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER secrets (xcodebuild authenticates to the developer portal with them). If they are environment secrets, call with 'secrets: inherit'."
              exit 1
            fi
            ARGS+=(
              -authenticationKeyPath "${P8_PATH}"
              -authenticationKeyID "${KEY_ID}"
              -authenticationKeyIssuerID "${ISSUER}"
            )
          fi
          SETTINGS=()
          if [[ -n "${BUILD_NUMBER}" ]]; then
            SETTINGS+=(CURRENT_PROJECT_VERSION="${BUILD_NUMBER}")
          fi
          if [[ -n "${TEAM_ID}" ]]; then
            # Injects the team for repos that keep it out of committed
            # config (e.g. in a gitignored xcconfig).
            SETTINGS+=(DEVELOPMENT_TEAM="${TEAM_ID}")
          fi
          # ${SETTINGS[@]+…} guard: macOS /bin/bash is 3.2, where expanding
          # an empty array under `set -u` is an unbound-variable error.
          xcodebuild archive "${ARGS[@]}" ${SETTINGS[@]+"${SETTINGS[@]}"}

      - name: Verify the SPM pins did not move (post-archive)
        if: inputs.spm_resolved_path != ''
        env:
          SPM_RESOLVED: ${{ inputs.spm_resolved_path }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SPM_RESOLVED}"

      - name: Export signed .ipa
        env:
          SCHEME: ${{ inputs.scheme }}
          SIGNING: ${{ inputs.signing }}
          PLIST: ${{ steps.export-opts.outputs.plist-path }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P8_PATH: ${{ steps.asc-key.outputs.p8-path }}
        run: |
          set -euo pipefail
          rm -rf build/export
          ARGS=(
            -exportArchive
            -archivePath "build/${SCHEME}.xcarchive"
            -exportOptionsPlist "${PLIST}"
            -exportPath build/export
            -allowProvisioningUpdates
          )
          if [[ "${SIGNING}" == "import" ]]; then
            ARGS+=(
              -authenticationKeyPath "${P8_PATH}"
              -authenticationKeyID "${KEY_ID}"
              -authenticationKeyIssuerID "${ISSUER}"
            )
          fi
          xcodebuild "${ARGS[@]}"

      - name: Verify .ipa produced
        # -exportArchive can "succeed" without writing an .ipa when export
        # options are wrong.
        id: ipa
        run: |
          set -euo pipefail
          ipa="$(ls build/export/*.ipa 2>/dev/null | head -1 || true)"
          if [[ -z "${ipa}" ]]; then
            echo "::error::no .ipa produced — check the export step output"
            ls -la build/export/ || true
            exit 1
          fi
          echo "ipa-path=${ipa}" >> "$GITHUB_OUTPUT"
          echo "Exported: ${ipa}"

      - name: Zip dSYMs
        # dSYMs live inside the xcarchive. uploadSymbols: true also sends
        # them to Apple for app-store-connect exports, but keep our own
        # copy — symbol servers have been known to lose things, and ad-hoc
        # exports get no Apple-side copy at all.
        env:
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          DSYM_DIR="build/${SCHEME}.xcarchive/dSYMs"
          if [[ -d "${DSYM_DIR}" ]] && [[ -n "$(ls -A "${DSYM_DIR}")" ]]; then
            ditto -c -k --keepParent "${DSYM_DIR}" "build/${SCHEME}-dSYMs.zip"
            echo "dSYMs zipped: build/${SCHEME}-dSYMs.zip"
          else
            echo "::warning::no dSYMs in the archive; field crashes for this build won't be symbolicatable"
          fi

      - name: Upload IPA artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.scheme }}-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: ${{ inputs.ipa_retention_days }}

      - name: Upload dSYM artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dSYM-${{ inputs.scheme }}-${{ github.run_number }}
          path: build/*-dSYMs.zip
          # 365-day retention (the GitHub maximum): symbols must outlive
          # the 14-day IPA artefact.
          retention-days: 365
          if-no-files-found: warn

      - name: Upload to TestFlight
        # ASC API-key auth, never Apple-ID/app-specific-password. See the
        # header comment for why this is altool (and why notarytool is not
        # an option here).
        if: inputs.upload_to_testflight
        env:
          SIGNING: ${{ inputs.signing }}
          IPA: ${{ steps.ipa.outputs.ipa-path }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P8_PATH: ${{ steps.asc-key.outputs.p8-path }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY_ID}" || -z "${ISSUER}" ]]; then
            echo "::error::upload_to_testflight needs the APPLE_API_KEY_ID and APPLE_API_ISSUER secrets in both signing modes. If they are environment secrets, call with 'secrets: inherit'."
            exit 1
          fi
          if ! xcrun --find altool >/dev/null 2>&1; then
            echo "::error::this Xcode has no altool — its --upload-app was Apple-deprecated and has now been removed. Migrate this step to ExportOptions 'destination: upload' (see the workflow header)."
            exit 1
          fi
          if [[ "${SIGNING}" == "import" ]]; then
            # altool discovers the .p8 by Key ID from a private_keys
            # directory; API_PRIVATE_KEYS_DIR points it at a throwaway one
            # (removed in the always() cleanup below).
            mkdir -p "${RUNNER_TEMP}/private_keys"
            cp "${P8_PATH}" "${RUNNER_TEMP}/private_keys/AuthKey_${KEY_ID}.p8"
            export API_PRIVATE_KEYS_DIR="${RUNNER_TEMP}/private_keys"
          fi
          # runner-keychain mode: the .p8 already sits at
          # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8 on the
          # runner (fleet contract) — altool searches there.
          echo "Uploading ${IPA} to App Store Connect…"
          xcrun altool --upload-app -f "${IPA}" -t ios \
            --apiKey "${KEY_ID}" --apiIssuer "${ISSUER}"
          echo "Uploaded — appears in TestFlight once processing finishes (~5–15 min)."

      - name: Clean up signing material
        # `import` mode only, and always() so it runs even after failures:
        # the ephemeral keychain and every staged copy of the .p8 must not
        # outlive the job. Deliberately NOT run in runner-keychain mode —
        # nothing was created there, and the runner's own keychain and
        # ~/.appstoreconnect keys are persistent fleet state this workflow
        # must never touch.
        if: always() && inputs.signing == 'import'
        env:
          P8_PATH: ${{ steps.asc-key.outputs.p8-path }}
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.keychain-path }}
        run: |
          rm -f "${P8_PATH}" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/private_keys" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/cert.p12" 2>/dev/null || true
          if [ -n "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi
          # Fallback for the default keychain name in case the composite
          # failed before writing its output.
          security delete-keychain "${RUNNER_TEMP}/build.keychain" 2>/dev/null || true
