name: 'Set up Apple signing keychain'
description: >-
  Creates an ephemeral keychain under $RUNNER_TEMP, imports a Developer ID
  Application certificate (.p12) into it, and grants Apple's signing tools
  non-interactive access to the private key so codesign never hangs waiting
  for a GUI "allow access" dialog on a headless runner.

  The keychain password is random (uuidgen), masked in logs, and surfaced as
  an output only so a caller could re-unlock the keychain if it ever locks.
  The decoded .p12 is deleted as soon as the import succeeds.

  PAIRED CLEANUP (required): composite actions cannot run `post:` steps, so
  the calling job MUST include an `if: always()` step that deletes the
  keychain, e.g.

    - name: Clean up signing material
      if: always()
      env:
        KEYCHAIN_PATH: <expression reading steps.<this-step-id>.outputs.keychain-path>
      run: |
        if [ -n "$KEYCHAIN_PATH" ]; then
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        fi

inputs:
  certificate-base64:
    description: >-
      base64-encoded .p12 containing the Developer ID Application certificate
      and its private key (the APPLE_CERTIFICATE secret).
    required: true
  certificate-password:
    description: >-
      Passphrase for the .p12 (the APPLE_CERTIFICATE_PASSWORD secret).
    required: true
  keychain-name:
    description: >-
      Filename of the throwaway keychain created under $RUNNER_TEMP.
    required: false
    default: 'build.keychain'

outputs:
  keychain-path:
    description: >-
      Absolute path of the ephemeral keychain. Pass to codesign via
      --keychain (release scripts read it as KEYCHAIN_PATH) and to the
      paired always() cleanup step.
    value: ${{ steps.setup.outputs.keychain-path }}
  keychain-password:
    description: >-
      Random password of the ephemeral keychain (masked in logs).
    value: ${{ steps.setup.outputs.keychain-password }}

runs:
  using: 'composite'
  steps:
    - name: Create keychain and import certificate
      id: setup
      shell: bash
      env:
        CERT_BASE64: ${{ inputs.certificate-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        KEYCHAIN_NAME: ${{ inputs.keychain-name }}
      run: |
        set -euo pipefail

        if [ -z "${CERT_BASE64}" ]; then
          echo "::error::certificate-base64 input is empty — is the APPLE_CERTIFICATE secret set (and reachable from this job)?"
          exit 1
        fi

        KEYCHAIN_PATH="${RUNNER_TEMP}/${KEYCHAIN_NAME}"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        # Mask before the value can appear anywhere in the log.
        echo "::add-mask::${KEYCHAIN_PASSWORD}"

        security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        # Auto-lock after 6h — longer than any sane release job, shorter
        # than forever if cleanup is somehow skipped.
        security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
        security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

        printf '%s' "${CERT_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
        # -T whitelists the tools allowed to use the imported private key
        # without an interactive prompt. codesign and security are the two
        # that touch it during a release.
        security import "${RUNNER_TEMP}/cert.p12" \
          -P "${CERT_PASSWORD}" \
          -t cert -f pkcs12 -k "${KEYCHAIN_PATH}" \
          -T /usr/bin/codesign -T /usr/bin/security
        # The decoded .p12 has served its purpose — remove it immediately
        # rather than waiting for job-end cleanup.
        rm -f "${RUNNER_TEMP}/cert.p12"

        # Without set-key-partition-list, the first codesign that uses the
        # key on a freshly-imported keychain blocks on a GUI "allow access"
        # dialog — which never appears on a headless runner, so the job
        # hangs until it times out. This grants the Apple tooling
        # non-interactive access to the key.
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null

        # Put the throwaway keychain at the front of the search list so
        # codesign finds the identity without -keychain hints, keeping the
        # existing keychains reachable.
        security list-keychain -d user -s \
          "${KEYCHAIN_PATH}" \
          $(security list-keychains -d user | tr -d '"')

        echo "keychain-path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
        echo "keychain-password=${KEYCHAIN_PASSWORD}" >> "$GITHUB_OUTPUT"
