name: 'Install Sparkle CLI tools (pinned)'
description: >-
  Downloads a pinned Sparkle release tarball, verifies its SHA-256 before
  extracting anything, and prepends its bin/ directory (generate_appcast,
  sign_update, generate_keys, ...) to PATH.

  This replaces the unpinned `brew install --cask sparkle` some repos used:
  the cask floats to whatever version Homebrew currently ships, and nothing
  checks what was actually downloaded. Here both the version and the archive
  digest are pinned, so a compromised or replaced release asset fails the
  job instead of signing your appcast.

  IMPORTANT: version and sha256 must be bumped together. The default sha256
  only matches the default version's tarball; overriding one without the
  other fails the checksum verification (by design).

inputs:
  version:
    description: >-
      Sparkle release to install, e.g. "2.9.5". Track the runtime Sparkle
      version your app links against (minor CLI/framework mismatches within
      the 2.x line are fine — appcast/signature formats are stable).
    required: false
    default: '2.9.5'
  sha256:
    description: >-
      Expected SHA-256 of Sparkle-<version>.tar.xz. Must be updated in
      lockstep with `version`.
    required: false
    default: '015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc'

outputs:
  bin-path:
    description: >-
      Directory containing the Sparkle CLI binaries (already appended to
      GITHUB_PATH for subsequent steps).
    value: ${{ steps.install.outputs.bin-path }}

runs:
  using: 'composite'
  steps:
    - name: Download, verify, and install Sparkle CLI
      id: install
      shell: bash
      env:
        SPARKLE_VERSION: ${{ inputs.version }}
        SPARKLE_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        if [ -z "${SPARKLE_SHA256}" ]; then
          echo "::error::sha256 input is empty — refusing to install an unverified Sparkle tarball"
          exit 1
        fi

        archive="${RUNNER_TEMP}/Sparkle-${SPARKLE_VERSION}.tar.xz"
        url="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"

        # Download to disk first (never pipe straight into tar) so the
        # checksum is verified before a single byte is extracted.
        curl -fsSL --retry 3 --retry-delay 5 -o "${archive}" "${url}"

        echo "${SPARKLE_SHA256}  ${archive}" | shasum -a 256 -c - || {
          echo "::error::Sparkle ${SPARKLE_VERSION} tarball failed SHA-256 verification."
          echo "::error::Expected ${SPARKLE_SHA256}"
          echo "::error::Got      $(shasum -a 256 "${archive}" | awk '{print $1}')"
          echo "::error::If you bumped 'version', bump 'sha256' in lockstep (see action docs)."
          exit 1
        }

        install_dir="${RUNNER_TEMP}/sparkle-cli"
        mkdir -p "${install_dir}"
        tar -xJf "${archive}" -C "${install_dir}"
        rm -f "${archive}"

        # Sanity-check the binaries are where the tarball layout says.
        test -x "${install_dir}/bin/generate_appcast" || {
          echo "::error::generate_appcast missing after extracting Sparkle ${SPARKLE_VERSION}"
          exit 1
        }
        test -x "${install_dir}/bin/sign_update" || {
          echo "::error::sign_update missing after extracting Sparkle ${SPARKLE_VERSION}"
          exit 1
        }

        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        echo "bin-path=${install_dir}/bin" >> "$GITHUB_OUTPUT"
        echo "Sparkle ${SPARKLE_VERSION} CLI installed at ${install_dir}/bin"
