name: 'Deploy a static site with just deploy'
description: >-
  Installs `just` (pinned) and runs the site's own `just deploy` recipe with
  the Cloudflare credentials in the environment wrangler reads
  (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). The recipe — not this
  action — owns the wrangler command line, so a site can change how it
  deploys without touching the workflow. Node is preinstalled on
  GitHub-hosted runners; the recipes use `npx --yes wrangler@latest`.

  Both inputs are required and checked before anything runs: an empty
  token would make wrangler prompt for a browser login and hang the job.
  The reusable workflows gate the call on the secrets being present and
  print a ::notice instead when they are not.

inputs:
  api-token:
    description: 'Cloudflare API token with Workers Scripts:Edit on the account.'
    required: true
  account-id:
    description: 'Cloudflare account id the Worker lives in.'
    required: true
  working-directory:
    description: 'Directory holding the justfile.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: just deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        set -euo pipefail
        if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
          echo "::error::api-token and account-id are both required — refusing to run wrangler without credentials"
          exit 1
        fi
        if [ ! -f justfile ]; then
          echo "::error::no justfile in $(pwd) — nothing to deploy with"
          exit 1
        fi
        just deploy
