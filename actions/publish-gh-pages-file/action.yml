name: 'Publish a single file to a Pages branch'
description: >-
  Commits one file (typically Sparkle's appcast.xml) to a branch — default
  gh-pages — using a git worktree so the job's existing checkout is left
  undisturbed.

  Requirements on the calling job:
    • `permissions: contents: write`
    • the repo checkout must be able to push, i.e. actions/checkout ran
      with its default persist-credentials: true (do NOT set it to false
      on the checkout this action publishes from).

  Branch resolution ladder (from the proven FrameSplash release flow):
    1. the branch already exists locally or on origin  → use it
    2. only origin/<branch> exists                     → branch from it
    3. the branch exists nowhere                       → branch from HEAD
  Note that case 3 seeds the Pages branch from the current commit (full
  source history). Create an orphan branch once by hand if you want a
  history-free Pages branch.

  If the file is identical to what the branch already has, the action
  logs and exits successfully without committing (a re-run of a release
  should not fail here).

inputs:
  file:
    description: 'Path (relative to the workspace) of the file to publish.'
    required: true
  branch:
    description: 'Branch to publish to.'
    required: false
    default: 'gh-pages'
  destination:
    description: >-
      Path of the file inside the branch. Defaults to the basename of
      `file` at the branch root.
    required: false
    default: ''
  commit-message:
    description: 'Commit message. Defaults to "Publish <destination>".'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Publish file via git worktree
      shell: bash
      env:
        SRC_FILE: ${{ inputs.file }}
        BRANCH: ${{ inputs.branch }}
        DESTINATION: ${{ inputs.destination }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail

        if [ ! -f "${SRC_FILE}" ]; then
          echo "::error::file to publish not found: ${SRC_FILE}"
          exit 1
        fi

        DEST="${DESTINATION:-$(basename "${SRC_FILE}")}"
        MESSAGE="${COMMIT_MESSAGE:-Publish ${DEST}}"
        WORKTREE_DIR="${RUNNER_TEMP}/publish-pages-worktree"

        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin "${BRANCH}" || true
        git worktree add "${WORKTREE_DIR}" "${BRANCH}" 2>/dev/null \
          || git worktree add -b "${BRANCH}" "${WORKTREE_DIR}" "origin/${BRANCH}" \
          || git worktree add -b "${BRANCH}" "${WORKTREE_DIR}"

        mkdir -p "$(dirname "${WORKTREE_DIR}/${DEST}")"
        cp "${SRC_FILE}" "${WORKTREE_DIR}/${DEST}"

        (
          cd "${WORKTREE_DIR}"
          git add "${DEST}"
          if git diff --cached --quiet; then
            echo "${DEST} already up to date on ${BRANCH}; nothing to push."
          else
            git commit -m "${MESSAGE}"
            git push origin "${BRANCH}"
            echo "Published ${DEST} to ${BRANCH}."
          fi
        )

        git worktree remove --force "${WORKTREE_DIR}" 2>/dev/null || true
